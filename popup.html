<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="viewer.css">
<style>
  body {
    width: 290px;
    padding: 18px 18px 16px;
    background-color: #0b1020;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(139,124,246,0.22) 1.4px, transparent 0),
      linear-gradient(160deg, #0b1020 0%, #121a2b 45%, #0f172b 100%);
    background-size: 18px 18px, cover;
  }
  .popup-shell {
    background: rgba(15,23,42,0.9);
    border: 1px solid rgba(148,163,184,0.12);
    border-radius: 18px;
    padding: 14px 14px 12px;
    box-shadow: 0 18px 35px rgba(1, 6, 20, 0.38);
  }
  .logo{font-size:21px;margin:0 0 8px}.u{font-size:12px;color:#a9b7d0;margin:0 0 14px;word-break:break-all;line-height:1.5}
  button.go{width:100%;padding:12px;font-size:14px;border-radius:14px}
</style></head>
<body><div class="popup-shell"><div class="logo brand">viewly<i>.</i></div><p class="u" id="u">…</p>
<button class="go primary" id="go">Open in Viewly</button></div><script src="popup.js"></script></body></html>
